<!doctype html>
<html>
  <!-- Pets profile page (PET OWNER; AUTH) -->
  <head>
    <title>Pets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 id="pets-header-one">Add your Pet!</h1>
    <!-- Lists of pets with photo+details, effectively the MySQL table but whenever you hover the details+photos appear. -->
    <form id="pet-form" novalidate>
      <label for="pet-name">Pet name:</label>
      <input type="text" id="pet-name" name="petName" />

      <label for="pet-type">Type of pet:</label>
      <select id="pet-type" name="petType">
        <option value="">Choose a type</option>
        <option value="cat">Cat</option>
        <option value="dog">Dog</option>
        <option value="other">Other</option>
      </select>

      <label for="pet-breed">Breed:</label>
      <input type="text" id="pet-breed" name="petBreed" />

      <label for="pet-age">Age:</label>
      <input type="number" id="pet-age" name="petAge" />

      <label for="pet-photo">Photo URL:</label>
      <input type="url" id="pet-photo" name="petPhoto" />
      <!--T: error msg is red-->
      <p id="pet-message" style="color: red"></p>
      <button type="submit" class="btn btn-primary">Check Pet Details</button>
    </form>
    <script src="script.js"></script>
  </body>
</html>
