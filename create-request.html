<!doctype html>
<html>
  <!-- J : Form for creating requests (PET OWNERS; AUTH) -->
  <head>
    <title>New Request</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="create-request-page">
    <main class="container">
      <h1 class="" id="">Creating a Care Request</h1>
      <form id="create-request-form">
        <div class="row">
          <!-- T: Mobile full width. Anything bigger is half-width -->
          <div class="col-12 col-md-6">
            <!-- T: Service, dates, and budget deadline. Added options for pet choice -->
            <label for="pet">Your pet:</label>
            <select id="pet" name="petId" required>
              <option value=">">Choose a pet</option>
              <option value="1">Cloud - Cat</option>
              <option value="2">Rocky - Dog</option>
              <option value="3">Boush - Tinker</option>
            </select>
          </div>

          <!-- T: Mobile full width. Anything bigger is half-width -->
          <div class="col-12 col-md-6">
            <!-- T: Service, dates budget deadline. adding option for pet choice-->
            <label for="service">Required Service:</label>
            <select id="service" name="service" required>
              <option value=">">Choose a pet</option>
              <option value="walking">Pet walking</option>
              <option value="bathing">Pet bathing</option>
              <option value="grooming">Pet grooming</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-12 col-md-6">
            <label for="start-time">Service starts at:</label>
            <input
              type="datetime-local"
              id="start-time"
              name="startTime"
              required
            />
          </div>

          <div class="col-12 col-md-6">
            <label for="end-time">Service ends at:</label>
            <input
              type="datetime-local"
              id="end-time"
              name="endTime"
              required
            />
          </div>
        </div>

        <div class="row">
          <div class="col-12 col-md-6">
            <label for="budget">Total budget (AED):</label>
            <input type="number" id="budget" name="budget" required />
          </div>

          <div class="col-12 col-md-6">
            <label for="deadline">Bidding Deadline:</label>
            <input type="datetime" id="deadline" name="deadLine" required />
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <label for="additional-instructions">
              Additional care instructions (optional):</label
            >
            <textarea
              id="additional-instructions"
              name="instructions"
            ></textarea>
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-primary">
              Create Request
            </button>
          </div>
        </div>
      </form>
      <!-- J: The request is then showed in /owner-requests.html if its confirmed -->
      <script></script>
    </main>
  </body>
</html>
