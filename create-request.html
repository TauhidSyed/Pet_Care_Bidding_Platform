<!DOCTYPE html>
<html> <!-- Form for creating requests (PET OWNERS; AUTH) -->
    <head>
        <title>New Request</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <h1 class="" id="">Creating Request</h1>
        <form class="" id="">
            <div class="" id="">
                <label for="service" class="">Required Service:</label>
                <input type="text" class="" id="service" placeholder="Please enter your required service">
            </div>
            <div class="" id="">
                <label for="date" class="">Date for Service:</label>
                <input type="date" class="" id="date">
            </div>
            <div class="" id="">
                <label for="budget" class="">Budget for Service:</label>
                <input type="text" class="" id="budget" placeholder="Please enter your budget">         
            </div>
            <div class="" id="">
                <label for="deadline" class="">Bidding Deadline:</label>
                <input type="text" class="" id="deadline" placeholder="Please enter your bidding deadline">         
            </div>
            <button type="submit" class="" id="">Create Request</button>
        <!-- The request is then showed in owner-requests.html if its confirmed -->
        <script></script>
    </body>
</html>
