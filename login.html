<!doctype html>
<html>
  <!-- Login page (BOTH; NO-AUTH) -->
  <head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <!-- EXTRA 2:
            One of the extra features could be a "Forget your password" page or maybe swap the username with an email?
            So the username part works with either username or email?
        -->
    <h1 id="login-header-one">Login</h1>
    <form id="login-form">
      <div>
        <label for="username" class="">Username:</label>
        <input
          type="text"
          class="username"
          id="username"
          placeholder="Please enter your username"
        />
      </div>
      <div>
        <label for="password" class="">Password:</label>
        <input
          type="password"
          class=""
          id="password"
          placeholder="Please enter your password"
        />
      </div>
      <button type="submit" class="btn btn-primary" id="">Login</button>
      <!-- On successful login, link to either /owner-dashboard or /provider-dashboard -->
    </form>
    <script></script>
  </body>
</html>
