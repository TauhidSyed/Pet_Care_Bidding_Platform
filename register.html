<!doctype html>
<html>
  <!-- Registration page (BOTH; NO-AUTH) -->
  <head>
    <title>Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="register-page">
    <h1 id="register-header-one">Registration</h1>
    <!-- EXTRA 1B: 
            We could add a radio button toggle for owner vs provider which toggles everything after the password entry,
            then add a few more things for care-providers. 
            Also, if we did the "Im a Pet Owner" and "Im a Care Provider" on index, then maybe it can toggle a switch which could
            show/hide

            EXTRA 4:
            We could add a thing that makes you enter the password twice, then checks if they are equal. This would allow us to 
            change the type to password instead of text.
            
            Extra 5:
            Alternatively, we make it natively type=password, then have a button that changes it to text (like the eye button that
            shows and hides the password when you click/hold it).
        -->

    <!-- T: Used same code format as login.html-->
    <form id="register-form" novalidate>
      <div>
        <label>Which one are you?</label>
        <div class="register-radio-options">
          <label>
            <input type="radio" value="owner" name="userType" />
            Pet Owner
          </label>
          <label>
            <input type="radio" name="userType" value="carer" />
            Care Provider
          </label>
        </div>
      </div>
      <div>
        <label for="username" class="">Username:</label>
        <input
          type="text"
          class="username"
          id="username"
          placeholder="Please enter your username"
          name="username"
        />
      </div>
      <div>
        <label for="email" class="">Email:</label>
        <input
          type="email"
          class="email"
          id="email"
          placeholder="Please enter your email"
          name="email"
        />
      </div>
      <div>
        <label for="password" class="">Password:</label>
        <input
          type="text"
          class=""
          id="password"
          placeholder="Please enter your password"
          name="password"
        />
      </div>

      <div>
        <label for="confirm-password" class="">Confirm Password:</label>
        <input
          type="password"
          class=""
          id="confirm-password"
          placeholder="Please re-enter your password"
          name="confirmPassword"
        />
      </div>

      <p id="register-message" style="color: red"></p>
      <button type="submit" class="btn btn-primary">Register</button>
      <!-- EXAMPLE of thing you hide if you pick "Im a Pet Owner" and shown if you pick "Im a Care Provider"
            <div class="" id="">
                <label for="service" class="">Service:</label>
                <input type="text" class="" id="service" placeholder="Please describe your service">         
            </div>
            -->

      <!-- If successful, the register button puts their data into the database, then links them to /login.html -->
    </form>
    <script src="script.js"></script>
  </body>
</html>
