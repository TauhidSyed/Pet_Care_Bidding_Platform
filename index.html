<!doctype html>
<html>
  <!-- Landing page (BOTH; NO-AUTH) -->
  <head>
    <title>Welcome!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <a href="owner-dashboard.html">Back to Dashboard</a>

      <h1>Create a Care Request</h1>

      <form id="create-request-form">
        <div class="row">
          <div class="col-12 col-md-6">
            <label for="pet">Your pet</label><br />
            <select id="pet" name="petId" required>
              <option value="">Choose a pet</option>
              <option value="1">Max — Dog</option>
              <option value="2">Luna — Cat</option>
            </select>
          </div>

          <div class="col-12 col-md-6">
            <label for="service">Required service</label><br />
            <select id="service" name="service" required>
              <option value="">Choose a service</option>
              <option value="sitting">Pet sitting</option>
              <option value="walking">Pet walking</option>
              <option value="feeding">Pet feeding</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-12 col-md-6">
            <label for="start-date">Service starts</label><br />
            <input
              type="datetime-local"
              id="start-date"
              name="startDate"
              required
            />
          </div>

          <div class="col-12 col-md-6">
            <label for="end-date">Service ends</label><br />
            <input
              type="datetime-local"
              id="end-date"
              name="endDate"
              required
            />
          </div>
        </div>

        <div class="row">
          <div class="col-12 col-md-6">
            <label for="budget">Total budget (AED)</label><br />
            <input
              type="number"
              id="budget"
              name="budget"
              min="0.01"
              step="0.01"
              required
            />
          </div>

          <div class="col-12 col-md-6">
            <label for="deadline">Bidding deadline</label><br />
            <input
              type="datetime-local"
              id="deadline"
              name="deadline"
              required
            />
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <label for="instructions"> Care instructions (optional) </label
            ><br />
            <textarea id="instructions" name="instructions" rows="3"></textarea>
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-primary">
              Create Request
            </button>
          </div>
        </div>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
